# Recurring jobs run by Solid Queue's scheduler, which bin/dev starts inside Puma.
# Schedules use the app's time zone (UTC).

weekly_tasks: &weekly_tasks
  weekly_pipeline:
    class: WeeklyPipelineJob
    queue: default
    schedule: every monday at 6am

development:
  <<: *weekly_tasks

production:
  <<: *weekly_tasks
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
